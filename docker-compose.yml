# 「情谊有账」Web 版 —— Docker Compose 编排
#
# 用法（本文件不自行构建，需先 docker compose build 或由上层流水线构建镜像）：
#   cp .env.example .env      # 按需改端口 / UID
#   sudo docker compose up -d --build
#
# 关于 user 与目录权限（第一次跑最常踩的坑）：
#   容器以非 root 身份运行，宿主机的 ./data 和 ./exports 必须可被该 UID 写入。
#   本工程目录当前属主是 hermes-agent(uid 987)，若沿用同一目录，请在 .env 里设
#     QY_UID=987
#     QY_GID=987
#   或者执行：sudo chown -R 1000:1000 data exports
#   否则启动后写 data.json 会 permission denied。

services:
  qingyi-youzhang:
    build:
      context: .
      dockerfile: Dockerfile
    image: qingyi-youzhang:1.0.0
    container_name: qingyi-youzhang

    # 对外端口 : 容器内端口（容器内固定 6189，由 PORT 环境变量决定）
    ports:
      - "${QY_PORT:-6189}:6189"

    environment:
      # TCP 模式：SOCKET 必须为空，否则程序会去监听 Unix socket
      PORT: "6189"
      WWW: /app/www
      DATA_FILE: /data/data.json
      # 变量名沿用原版 fpk 约定，指向「导出到 NAS」的落地目录
      TRIM_DATA_SHARE_PATHS: /exports
      TZ: Asia/Shanghai

    volumes:
      # 账本数据（data.json + 自动轮转的 .bak.1~3）
      - ./data:/data
      # 「导出到 NAS」与 Excel 导出落地目录
      - ./exports:/exports

    user: "${QY_UID:-1000}:${QY_GID:-1000}"

    restart: unless-stopped

    # 容器无外网需求，只用宿主映射端口
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6189/api/storage"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
