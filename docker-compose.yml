# 情谊有账 —— 直接改下面两处即可：
#   QY_PASSWORD   访问密码
#   /your/path    数据持久化目录（改成宿主机上的绝对路径，不要放在源码目录里）
#
# 在源码目录执行：
#   docker compose up -d --build

services:
  qingyi-book:
    build: .
    image: qingyi-book:latest
    container_name: qingyi-book
    restart: unless-stopped
    ports:
      - "6189:6189"
    environment:
      QY_PASSWORD: "改成你的密码"
      TZ: Asia/Shanghai
      # 挂 HTTPS 反向代理后改成 true；纯内网 http 直连保持 false
      QY_COOKIE_SECURE: "false"
    volumes:
      # 数据目录：改成宿主机绝对路径。删源码目录不影响这里。
      - /your/path/qingyi-book-data:/data
      - /your/path/qingyi-book-exports:/exports
